version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=production_user
      - DB_PASSWORD=production_pass
      - DB_NAME=production_report
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-strong-random-secret-in-production}
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: production_user
      POSTGRES_PASSWORD: production_pass
      POSTGRES_DB: production_report
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
